name: WindowSnap
options:
  bundleIdPrefix: com.windowsnap
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.1"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.windowsnap.app
    PRODUCT_NAME: WindowSnap
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_FILE: WindowSnap/Resources/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_ENTITLEMENTS: WindowSnap/Resources/WindowSnap.entitlements
    # 메뉴바 전용 앱 설정 (Dock 아이콘 숨김)
    LSUIElement: "YES"
    SWIFT_STRICT_CONCURRENCY: targeted
    GCC_OPTIMIZATION_LEVEL: "0"

targets:
  WindowSnap:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: WindowSnap
        excludes:
          - "**/*.entitlements"
          - Resources/Assets.xcassets
    resources:
      - path: WindowSnap/Resources/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: WindowSnap/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: WindowSnap/Resources/WindowSnap.entitlements

  WindowSnapTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      # 순수 로직 테스트용 소스만 포함 (AppKit/NSApplication 의존성 최소화)
      - path: WindowSnapTests
      - path: WindowSnap/Core/Models/LayoutPreset.swift
      - path: WindowSnap/Core/SnapCalculator.swift
      - path: WindowSnap/Settings/AppSettings.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: targeted

schemes:
  WindowSnap:
    build:
      targets:
        WindowSnap: [run, archive]
        WindowSnapTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WindowSnapTests
